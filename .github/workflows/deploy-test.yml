name: Deploy to /test/

on:
  push:
    branches: [sthefany-test]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get runner public IP
        id: ip
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)/32" >> "$GITHUB_OUTPUT"

      - name: Open SSH port for this runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id sg-040f40fef53b4b9f5 \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}

      - name: Wait for security group propagation
        run: sleep 5

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_STHEFANY }}
          username: ${{ secrets.EC2_USER_STHEFANY }}
          key: ${{ secrets.EC2_SSH_KEY_STHEFANY }}
          timeout: 60s
          script: |
            cd /home/ubuntu/location-tracking-system-test
            git fetch origin
            git checkout sthefany-test
            git pull origin sthefany-test
            source venv/bin/activate
            pip install -r requirements.txt
            cd disenop2web
            npm install
            npm run build
            cd ..
            sudo systemctl restart gunicorn-location-test

      - name: Close SSH port for this runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id sg-040f40fef53b4b9f5 \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}
